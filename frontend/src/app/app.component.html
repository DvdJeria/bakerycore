<ion-app>
  <!-- Menú lateral de navegación -->
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>BakeryCore</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/home" routerDirection="root" lines="none">
            <ion-icon slot="start" name="book-outline"></ion-icon>
            <ion-label>Recetario</ion-label>
          </ion-item>

          <ion-item routerLink="/pedidos" routerDirection="root" lines="none">
            <ion-icon slot="start" name="calendar-outline"></ion-icon>
            <ion-label>Calendario de Pedidos</ion-label>
          </ion-item>

          <ion-item routerLink="/cotizaciones" routerDirection="root" lines="none">
            <ion-icon slot="start" name="calculator-outline"></ion-icon>
            <ion-label>Cotizaciones</ion-label>
          </ion-item>

          <ion-item routerLink="/clientes" routerDirection="root" lines="none">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Clientes</ion-label>
          </ion-item>

          <ion-item routerLink="/ingredientes" routerDirection="root" lines="none">
            <ion-icon slot="start" name="cube-outline"></ion-icon>
            <ion-label>Materia Prima</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Contenido principal de la app -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
